name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: aim-win-x64
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: aim-linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact_name: aim-osx-arm64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            artifact_name: aim-osx-x64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish Aim/Aim.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/Aim.exe -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/Aim
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C publish Aim

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
